name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "12.17.0"
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            pattern: "*.exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            pattern: "*.dmg"
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            pattern: "*.dmg"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Not code-signed (pilot; see docs/spec.md, Distribution).
      - name: pnpm tauri build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
        run: pnpm tauri build --target "$TARGET" --bundles "$BUNDLE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 files
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.exe *.dmg)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "::error::Expected 3 installers, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "haulmer-connect $TAG" \
            --generate-notes \
            ./*.exe ./*.dmg ./*.sha256 SHA256SUMS.txt
